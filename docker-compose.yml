name: homeassistant

services:
  homeassistant:
    container_name: home_assistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      # Needed for Bluetooth, removed for security
      #- /run/dbus:/run/dbus:ro
    restart: unless-stopped
    stop_grace_period: 60s
    # Needed for Bluetooth, removed for security
    #privileged: true
    network_mode: host
    environment:
      TZ: America/Chicago
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8123"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
